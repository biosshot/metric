[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/blob",
    "crates/domain",
    "crates/mongo",
    "crates/ports",
    "crates/sentry-protocol",
    "crates/server",
    "crates/symbolication",
    "crates/testkit",
    "tools/dependency-check",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/biosshot/metric"

[workspace.dependencies]
async-compression = { version = "0.4.27", features = ["gzip", "tokio", "zlib"] }
argon2 = { version = "0.5.3", features = ["std"] }
aws-sdk-s3 = { version = "=1.120.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-credential-types = "=1.2.11"
aws-runtime = "=1.5.18"
aws-sigv4 = "=1.3.7"
aws-smithy-async = "=1.2.7"
aws-smithy-checksums = "=0.63.13"
aws-smithy-eventstream = "=0.60.14"
aws-smithy-http = "=0.62.6"
aws-smithy-json = "=0.61.9"
aws-smithy-runtime = "=1.9.8"
aws-smithy-runtime-api = "=1.10.0"
aws-smithy-types = "=1.3.6"
aws-smithy-xml = "=0.60.13"
aws-types = "=1.3.11"
base64 = "0.22.1"
axum = "0.8.4"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
blake3 = "1.8.2"
clap = { version = "4.5.40", features = ["derive"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env", "toml"] }
flate2 = "1.1.1"
futures-util = "0.3.31"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.12.1"
humantime = "2.2.0"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
metrics = "0.24.2"
mongodb = "3.8.0"
parquet = { version = "=56.2.0", default-features = false, features = ["zstd"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
wait-timeout = "0.2.1"
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
