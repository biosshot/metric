role = "all"

[server]
http_address = "127.0.0.1:4001"
shutdown_grace = "10s"

[mongodb]
uri = { env = "MONGODB_URI" }
database = "faultkeep"
bootstrap_timeout = "10s"

[projects]
scrub_hmac_key = { env = "SCRUB_HMAC_KEY" }
identity_collision_retries = 16
max_keys_per_project = 32

[development]
allow_literal_secrets = false
allow_insecure_cookies = false

[blob]
root = "./faultkeep-data/blobs"
capacity = "1 GiB"
reserve = "128 MiB"
max_object_bytes = "100 MiB"

[native_crash.minidump]
# Minidumps may contain unsrubbable process memory. Enable only after accepting that risk.
enabled = false
max_bytes = "100 MiB"
chunk_bytes = "64 KiB"

[symbolicator]
# Leave endpoint unset to keep native Events on the explicit baseline path.
# endpoint = "http://127.0.0.1:3021/symbolicate"
callback_base_url = "http://127.0.0.1:4001/"
request_timeout = "20s"
maximum_concurrency = 8
circuit_failure_threshold = 5
circuit_cooldown = "30s"
maximum_response_bytes = "4 MiB"

[incident_capsule]
max_events = 10
max_activities = 100
max_total_uncompressed_bytes = "100 MiB"
max_entry_bytes = "16 MiB"
generation_timeout = "30s"
max_concurrency = 4
stream_chunk_bytes = "64 KiB"
stream_buffer_chunks = 4

[ingest]
max_compressed_request_bytes = "20 MiB"
max_decompressed_request_bytes = "100 MiB"
max_event_bytes = "1 MiB"
max_envelope_items = 100
max_active_requests = 512
max_parsing_tasks = 0
max_waiting_for_storage = 512
request_timeout = "10s"
unsupported_backoff_seconds = 3600

[ingest.attachments]
enabled = true
max_count = 10
max_item_bytes = "1 MiB"
max_total_bytes = "5 MiB"
chunk_bytes = "64 KiB"
orphan_grace = "24h"
cleanup_interval = "15m"
cleanup_batch_size = 256
cleanup_max_pages = 16

[ingest.project_cache]
capacity = 100000
max_inflight = 512
positive_ttl = "60s"
negative_ttl = "5s"

[ingest.batch]
max_wait = "20ms"
max_documents = 250
max_bytes = "8 MiB"

[ingest.event_codec]
compression_level = 3
compression_min_savings = 64

[ingest.backlog]
max_pending_events = 1000000
max_oldest_pending_age = "1h"

[dispatcher]
queue_capacity = 4096
worker_concurrency = 32
low_watermark = 1024
refill_target = 3072
refill_batch_size = 512
poll_interval = "100ms"
metrics_interval = "5s"
source_timeout = "5s"

[scheduler]
poll_interval = "1s"
maintenance_interval = "1m"
reconciliation_interval = "5m"
backlog_interval = "5s"
task_timeout = "10s"
retry_base = "1s"
retry_max = "1m"
batch_size = 500

[retention]
events_days = 30
issue_stats_hourly_days = 400

[project_deletion]
grace_period = "24h"
delete_batch_documents = 5000
completed_job_retention = "30d"
slug_reservation = "30d"
poll_interval = "1s"
operation_timeout = "10s"
drain_timeout = "10s"
retry_base = "1s"
retry_max = "1m"

[processor]
max_concurrency = 32
max_attempts = 5
retry_base = "1s"
retry_max = "5m"
stage_timeout = "15s"
total_timeout = "1m"
state_timeout = "5s"

[auth]
identity_collision_retries = 16
store_timeout = "5s"
setup_token_timeout = "24h"
max_api_token_lifetime = "365d"
activity_touch_interval = "5m"
secure_cookie = true

[auth.session]
idle_timeout = "7d"
absolute_timeout = "30d"

[auth.password]
memory_kib = 19456
iterations = 2
parallelism = 1
max_concurrency = 2

[auth.login]
max_attempts = 5
window = "1m"
capacity = 10000
