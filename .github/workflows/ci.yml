# Checks code and containers. This workflow never publishes anything.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Code and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.1
          cache-dependency-path: sdk-tests/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk-tests/python/requirements.lock.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: cargo fmt --all -- --check
      - run: cargo dep-graph --locked
      - run: python scripts/validate-compatibility.py
      - run: python scripts/validate-deployment-profiles.py
      - run: python scripts/validate-documentation.py
      - name: Verify Linux installer syntax
        run: sh -n deploy/install.sh
      - name: Verify PowerShell installer syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create(
            (Get-Content deploy/install.ps1 -Raw)
          )
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sdk-tests/node/package-lock.json
            sdk-tests/sentry-cli/package-lock.json
      - name: Verify Web
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium firefox
          npm run test:e2e
      - name: Retain failed Web traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify real Node SDK
        working-directory: sdk-tests/node
        run: |
          npm ci
          npm run format:check
          npm run lint
      - name: Verify real Go SDK
        working-directory: sdk-tests/go
        run: |
          gofmt -d .
          go mod verify
          go test ./...
      - name: Verify real Python SDK
        run: python -m pip install -r sdk-tests/python/requirements.lock.txt
      - name: Verify real Java SDK
        run: node sdk-tests/java/prepare.mjs
      - name: Verify real .NET SDK
        run: |
          dotnet restore --locked-mode sdk-tests/dotnet/MetricSdkCompatibility.csproj
          dotnet format --verify-no-changes --no-restore sdk-tests/dotnet/MetricSdkCompatibility.csproj
          dotnet build --configuration Release --no-restore sdk-tests/dotnet/MetricSdkCompatibility.csproj
      - name: Verify real Rust SDK
        run: cargo build --locked --manifest-path sdk-tests/rust/Cargo.toml
      - name: Run real SDK gates
        run: cargo test -p metric-server --test sdk_compatibility_e2e -- --ignored --skip real_browser_sdk_ --nocapture
      - name: Verify pinned Sentry CLI versions
        working-directory: sdk-tests/sentry-cli
        run: |
          npm ci
          npm run versions

  browser:
    name: Browser SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk-tests/browser/package-lock.json
      - name: Prepare Browser SDK
        working-directory: sdk-tests/browser
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Run Browser SDK gates
        run: cargo test -p metric-server --test sdk_compatibility_e2e real_browser_sdk_ -- --ignored --nocapture

  mongodb:
    name: MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METRIC_TEST_MONGODB_URI: mongodb://metric:metric-local-only@127.0.0.1:27018/?authSource=admin&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sdk-tests/sentry-cli/package-lock.json
      - name: Prepare real browser and CLI fixtures
        run: |
          npm ci --prefix web
          npm run build --prefix web
          cd web
          npx playwright install --with-deps chromium
          cd ..
          npm ci --prefix sdk-tests/sentry-cli
          echo "$GITHUB_WORKSPACE/sdk-tests/sentry-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start isolated MongoDB
        run: docker compose -f deploy/compose.dev.yml up -d --wait mongodb
      - name: Run storage and crash-resumable migration gates
        run: >-
          cargo test -p metric-mongo --all-targets --all-features --locked --no-fail-fast
          -- --ignored --skip performance_ --skip reports_rps --test-threads=1
      - name: Run real server integration gates
        run: >-
          cargo test -p metric-server --all-features --locked --no-fail-fast
          --test archive_e2e --test auth_e2e --test durable_ingest_e2e
          --test native_api_e2e --test notifications_e2e --test project_identity_e2e
          --test web_e2e --test releases_e2e --test debug_files_e2e
          -- --ignored --skip performance_ --test-threads=1
      - name: Inspect MongoDB after failure
        if: failure()
        run: docker compose -f deploy/compose.dev.yml logs mongodb
      - name: Stop isolated MongoDB
        if: always()
        run: docker compose -f deploy/compose.dev.yml down

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag metric:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: python -m pip install -r scripts/helm-requirements.txt
      - name: Validate Helm configurations with the built binary
        run: python scripts/validate-helm-chart.py --image metric:ci
      - name: Verify immutable Helm publication gates
        run: python scripts/test-helm-publish.py
      - name: Exercise packaging and retry in an isolated local registry
        shell: bash
        run: |
          set -euo pipefail
          registry_id="$(docker run --detach --rm --publish 127.0.0.1::5000 registry:2.8.3)"
          trap 'docker stop "$registry_id" >/dev/null' EXIT
          registry="oci://$(docker port "$registry_id" 5000/tcp)/charts"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python scripts/publish-helm-chart.py --registry "$registry" --release-tag "v${version}"
          python scripts/publish-helm-chart.py --registry "$registry" --release-tag "v${version}"
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.27.0
          kubectl_version: v1.32.2
          node_image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
          cluster_name: metric-helm-ci
      - name: Exercise Helm install, upgrade and persistent reinstall
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          docker tag metric:ci "metric-helm-test:${version}"
          docker pull mongo:8.0.12
          docker pull ghcr.io/getsentry/symbolicator:26.6.0
          kind load docker-image "metric-helm-test:${version}" mongo:8.0.12 ghcr.io/getsentry/symbolicator:26.6.0 --name metric-helm-ci
          python scripts/test-helm-cluster.py \
            --context kind-metric-helm-ci --image-repository metric-helm-test --with-symbolicator
      - name: Remove isolated Helm cluster
        if: always()
        run: kind delete cluster --name metric-helm-ci
      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          for profile in min low medium high; do
            docker compose \
              --env-file "deploy/profiles/${profile}.env.example" \
              -f deploy/compose.yml \
              config --quiet
          done
      - name: Verify Min deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment="${RUNNER_TEMP}/metric-min"
          mkdir -p "${deployment}"
          cp deploy/compose.yml "${deployment}/compose.yml"
          cp deploy/profiles/min.toml "${deployment}/metric.toml"
          cp deploy/profiles/min.env.example "${deployment}/.env"
          cp deploy/symbolicator.yml "${deployment}/symbolicator.yml"
          export METRIC_IMAGE=metric:ci
          export METRIC_MONGO_PASSWORD=metric-ci-password
          export METRIC_SCRUB_HMAC_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          compose=(docker compose --env-file "${deployment}/.env" -f "${deployment}/compose.yml")
          cleanup() {
            "${compose[@]}" down --volumes
          }
          trap cleanup EXIT
          if ! "${compose[@]}" up -d --wait --wait-timeout 120; then
            "${compose[@]}" logs
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4001/ready
      - name: Verify Symbolicator container
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file deploy/profiles/medium.env.example -f deploy/compose.yml)
          cleanup() {
            "${compose[@]}" down --volumes
          }
          trap cleanup EXIT
          if ! "${compose[@]}" up -d --wait --wait-timeout 120 symbolicator; then
            "${compose[@]}" logs symbolicator
            exit 1
          fi
