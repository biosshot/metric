# Publishes a versioned container image and creates a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match Git tag and Cargo version
        shell: bash
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}."
            exit 1
          fi

  # Builds AMD64 and ARM64 in parallel on native GitHub runners, then publishes
  # one multi-platform image. This avoids compiling Rust through QEMU.
  image:
    name: Publish container image
    needs: validate
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/metric
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,prefix=sha-
      meta-labels: |
        org.opencontainers.image.title=Metric
        org.opencontainers.image.description=Sentry-compatible error tracking and observability
      set-meta-labels: true
      cache: true
      cache-mode: max
      cache-scope: release
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: Publish GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Metric ${GITHUB_REF_NAME#v}"
