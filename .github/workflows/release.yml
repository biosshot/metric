# Publishes the matching container image and Helm chart, then a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: python -m pip install -r scripts/helm-requirements.txt
      - name: Match Cargo, image and Helm chart versions and validate manifests
        run: python scripts/validate-helm-chart.py --release-tag "${{ github.ref_name }}"
      - name: Verify immutable Helm publication gates
        run: python scripts/test-helm-publish.py
      - name: Verify release documentation and notes
        run: python scripts/validate-documentation.py

      - name: Match Git tag and Cargo version
        shell: bash
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}."
            exit 1
          fi

  # Builds AMD64 and ARM64 in parallel on native GitHub runners, then publishes
  # one multi-platform image. This avoids compiling Rust through QEMU.
  image:
    name: Publish container image
    needs: validate
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/metric
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,prefix=sha-
      meta-labels: |
        org.opencontainers.image.title=Metric
        org.opencontainers.image.description=Sentry-compatible error tracking and observability
      set-meta-labels: true
      cache: true
      cache-mode: max
      cache-scope: release
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  helm-chart:
    name: Publish matching Helm chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: python -m pip install -r scripts/helm-requirements.txt
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish chart for every Metric release
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/publish-helm-chart.py \
            --registry "oci://ghcr.io/${REGISTRY_OWNER,,}/charts" \
            --release-tag "$RELEASE_TAG"

  github-release:
    name: Publish GitHub Release
    needs: [image, helm-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --title "Metric ${GITHUB_REF_NAME#v}"
