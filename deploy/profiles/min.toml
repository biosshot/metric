# Min profile: 1 vCPU, 1 GiB RAM, 15 GiB SSD.
# Intended for a few small projects and a low error rate.
# Symbolicator, attachments, minidumps and cold archive are disabled.

role = "all"

[server]
http_address = "0.0.0.0:4001"
shutdown_grace = "30s"
max_active_requests = 16
request_timeout = "20s"

[mongodb]
uri = { env = "MONGODB_URI" }
database = "metric"
bootstrap_timeout = "30s"

[projects]
scrub_hmac_key = { env = "SCRUB_HMAC_KEY" }
identity_collision_retries = 8
max_keys_per_project = 8

[blob]
backend = "local"
root = "/var/lib/metric/blobs"
capacity = "256 MiB"
reserve = "32 MiB"
max_object_bytes = "32 MiB"

[archive]
enabled = false
maximum_events = 50
target_uncompressed_bytes = "16 MiB"
write_chunk_bytes = "64 KiB"
poll_interval = "5m"
hot_copy_delay = "0s"
orphan_grace = "24h"
cleanup_max_pages = 1

[native_crash.minidump]
enabled = false
max_bytes = "16 MiB"
chunk_bytes = "16 KiB"

[symbolicator]
callback_base_url = "http://metric:4001/"
request_timeout = "10s"
maximum_concurrency = 1
circuit_failure_threshold = 3
circuit_cooldown = "30s"
maximum_response_bytes = "1 MiB"

[artifacts]
maximum_bundle_bytes = "8 MiB"
maximum_logical_bytes = "32 MiB"
maximum_entries = 1000
maximum_entry_bytes = "4 MiB"
maximum_concurrent_assemblies = 1
parse_timeout = "20s"
orphan_grace = "24h"
claim_lease = "5m"
blob_operation_timeout = "20s"
tombstone_retention = "24h"
gc_interval = "30m"
gc_batch_size = 10
gc_max_concurrency = 1
maximum_bytes_per_organization = "128 MiB"
maximum_bundles_per_organization = 20

[incident_capsule]
max_events = 5
max_activities = 25
max_total_uncompressed_bytes = "8 MiB"
max_entry_bytes = "2 MiB"
generation_timeout = "20s"
max_concurrency = 1
stream_chunk_bytes = "16 KiB"
stream_buffer_chunks = 1

[ingest]
max_compressed_request_bytes = "2 MiB"
max_decompressed_request_bytes = "8 MiB"
max_event_bytes = "512 KiB"
max_envelope_items = 20
max_active_requests = 8
max_parsing_tasks = 1
max_waiting_for_storage = 8
request_timeout = "10s"
unsupported_backoff_seconds = 3600

[ingest.attachments]
enabled = false
max_count = 3
max_item_bytes = "512 KiB"
max_total_bytes = "1 MiB"
chunk_bytes = "16 KiB"
orphan_grace = "24h"
cleanup_interval = "30m"
cleanup_batch_size = 32
cleanup_max_pages = 2

[ingest.replay]
max_segment_bytes = "1 MiB"
max_decompressed_segment_bytes = "4 MiB"
max_events_per_segment = 25000
queue_capacity = 1
max_queued_bytes = "1 MiB"
orphan_grace = "1h"
cleanup_interval = "15m"
cleanup_batch_size = 20

[ingest.project_cache]
capacity = 1000
max_inflight = 16
positive_ttl = "60s"
negative_ttl = "5s"

[ingest.batch]
max_wait = "50ms"
max_documents = 100
max_bytes = "512 KiB"

[ingest.backlog]
max_pending_events = 10000
max_oldest_pending_age = "1h"

[dispatcher]
queue_capacity = 128
worker_concurrency = 1
low_watermark = 32
refill_target = 96
refill_batch_size = 32
poll_interval = "250ms"
metrics_interval = "10s"
source_timeout = "5s"

[scheduler]
poll_interval = "2s"
maintenance_interval = "5m"
reconciliation_interval = "15m"
backlog_interval = "10s"
task_timeout = "10s"
retry_base = "1s"
retry_max = "1m"
batch_size = 50

[retention]
events_days = 7
feedback_days = 30
issue_stats_hourly_days = 90
logs_days = 3
spans_days = 3
span_stats_hourly_days = 30
sessions_days = 3
session_stats_hourly_days = 90
session_active_max_hours = 24
monitor_runs_days = 30
metrics_days = 30
metric_max_series_per_project = 1000
metric_archive = false
replays_days = 1
replay_archive = false

[project_deletion]
grace_period = "24h"
delete_batch_documents = 100
completed_job_retention = "7d"
slug_reservation = "30d"
poll_interval = "2s"
operation_timeout = "10s"
drain_timeout = "10s"
retry_base = "1s"
retry_max = "1m"

[processor]
max_concurrency = 1
max_attempts = 5
retry_base = "1s"
retry_max = "5m"
stage_timeout = "15s"
total_timeout = "1m"
state_timeout = "5s"

[auth.password]
memory_kib = 19456
iterations = 2
parallelism = 1
max_concurrency = 1

[auth.login]
max_attempts = 5
window = "1m"
capacity = 1000

[notifications]
transition_batch_size = 20
due_scan_limit = 20
poll_interval = "1s"

[notifications.queue]
capacity = 32
worker_concurrency = 1

[notifications.retention]
delivered_days = 7
dead_days = 30
