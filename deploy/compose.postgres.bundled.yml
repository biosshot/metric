# Generated by scripts/sync-installer-assets.py; edit shared deploy/compose.yml.
name: metric

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${METRIC_LOG_MAX_SIZE:-25m}
    max-file: ${METRIC_LOG_MAX_FILES:-4}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    mem_limit: ${METRIC_POSTGRES_MEMORY_LIMIT:-512m}
    environment:
      POSTGRES_USER: metric
      POSTGRES_DB: metric
      POSTGRES_PASSWORD: ${METRIC_POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U metric -d metric"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *default-logging

  metric:
    image: ${METRIC_IMAGE:-ghcr.io/biosshot/metric:0.1.8}
    restart: unless-stopped
    mem_limit: ${METRIC_APP_MEMORY_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
      symbolicator:
        condition: service_healthy
        required: false
    env_file: [./connection.env]
    environment:
      METRIC_POSTGRES_URI: postgres://metric:${METRIC_POSTGRES_PASSWORD}@postgres:5432/metric
      SCRUB_HMAC_KEY: ${METRIC_SCRUB_HMAC_KEY:?64 lowercase hex characters}
      METRIC_WEB_DIR: /opt/metric/web
    ports:
      - "${METRIC_HTTP_PORT:-4001}:4001"
    volumes:
      - ./metric.toml:/etc/metric/metric.toml:ro
      - blob-data:/var/lib/metric/blobs
    read_only: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:4001/ready]
      interval: 5s
      timeout: 2s
      start_period: 30s
      retries: 24
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  symbolicator:
    profiles: ["symbolication"]
    image: ${METRIC_SYMBOLICATOR_IMAGE:-ghcr.io/getsentry/symbolicator:26.6.0}
    restart: unless-stopped
    mem_limit: ${METRIC_SYMBOLICATOR_MEMORY_LIMIT:-2g}
    command: ["run", "-c", "/etc/symbolicator/config.yml"]
    volumes:
      - ./symbolicator.yml:/etc/symbolicator/config.yml:ro
      - symbolicator-cache:/data
    healthcheck:
      test:
        [
          "CMD",
          "/bin/symbolicator",
          "healthcheck",
          "-c",
          "/etc/symbolicator/config.yml",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  symbolicator-cleanup:
    profiles: ["symbolication"]
    image: ${METRIC_SYMBOLICATOR_IMAGE:-ghcr.io/getsentry/symbolicator:26.6.0}
    restart: unless-stopped
    mem_limit: ${METRIC_CLEANUP_MEMORY_LIMIT:-128m}
    command:
      [
        "cleanup",
        "-c",
        "/etc/symbolicator/config.yml",
        "--repeat",
        "1h",
      ]
    volumes:
      - ./symbolicator.yml:/etc/symbolicator/config.yml:ro
      - symbolicator-cache:/data
    depends_on:
      symbolicator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres-data:
  blob-data:
  symbolicator-cache:
