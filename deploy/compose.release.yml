name: metric

services:
  mongodb:
    image: mongo:8.0.12
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: metric
      MONGO_INITDB_ROOT_PASSWORD: ${METRIC_MONGO_PASSWORD:?set in release.env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "metric",
          "--password",
          "${METRIC_MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  metric:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://metric:${METRIC_MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      SCRUB_HMAC_KEY: ${METRIC_SCRUB_HMAC_KEY:?64 lowercase hex characters}
      METRIC_WEB_DIR: /opt/metric/web
    ports:
      - "${METRIC_HTTP_PORT:-4001}:4001"
    volumes:
      - blob-data:/var/lib/metric/blobs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  mongo-data:
  blob-data:
