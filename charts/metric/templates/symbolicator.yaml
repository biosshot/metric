{{- if and (eq (include "metric.symbolicatorEnabled" .) "true") (not .Values.symbolicator.externalEndpoint) -}}
{{- $profile := include "metric.profile" . | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metric.name" . }}-symbolicator
  labels:
    {{- include "metric.labels" . | nindent 4 }}
data:
  config.yml: |
    {{- include "metric.symbolicatorConfig" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metric.name" . }}-symbolicator
  labels:
    {{- include "metric.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 3021
      targetPort: http
  selector:
    {{- include "metric.selector" (dict "Release" .Release "component" "symbolicator") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metric.name" . }}-symbolicator
  labels:
    {{- include "metric.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "metric.selector" (dict "Release" .Release "component" "symbolicator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metric.selector" (dict "Release" .Release "component" "symbolicator") | nindent 8 }}
      annotations:
        checksum/config: {{ include "metric.symbolicatorConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: symbolicator
          image: {{ printf "%s:%s" .Values.symbolicator.image.repository .Values.symbolicator.image.tag | quote }}
          imagePullPolicy: {{ .Values.symbolicator.image.pullPolicy }}
          command: ["/bin/symbolicator", "run", "-c", "/etc/symbolicator/config.yml"]
          ports:
            - name: http
              containerPort: 3021
          resources:
            {{- mergeOverwrite (deepCopy $profile.symbolicatorResources) .Values.symbolicator.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/symbolicator", "healthcheck", "-c", "/etc/symbolicator/config.yml"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/symbolicator
              readOnly: true
            - name: cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: cleanup
          image: {{ printf "%s:%s" .Values.symbolicator.image.repository .Values.symbolicator.image.tag | quote }}
          imagePullPolicy: {{ .Values.symbolicator.image.pullPolicy }}
          command: ["/bin/symbolicator", "cleanup", "-c", "/etc/symbolicator/config.yml", "--repeat", "1h"]
          resources:
            {{- mergeOverwrite (deepCopy $profile.cleanupResources) .Values.symbolicator.cleanupResources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/symbolicator
              readOnly: true
            - name: cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "metric.name" . }}-symbolicator
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.symbolicator.cacheSize }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
