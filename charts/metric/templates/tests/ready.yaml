apiVersion: v1
kind: Pod
metadata:
  name: {{ include "metric.name" . }}-test
  labels:
    {{- include "metric.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 60
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: ready
      image: {{ include "metric.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["curl"]
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "15"
        - {{ printf "http://%s:%v/ready" (include "metric.name" .) .Values.service.port | quote }}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
